<body>


    <!--! Absolute URL   

    <a href="https://youtube.com">YouTube</a>

    <!--! Relative  

    <a href="./pages/home.html">Home</a>
    -->
 
      
    <!--! Linking 
    
    1. Kisi aur ki website ko link karna  
    2. Apni website ke ek page ko dosre page se link karna  
    3. Apni website ke page me ek section ko dosre section se link karna
    4. website ko new tab me kholwana

    -->
    
    <!--! 1. Kisi aur ki website ko link karna   
    
    <a href="https://www.youtube.com/">YouTube</a>

    -->

    <!--! 2. Apni website ke ek page ko dosre page se link karna  
    
    <a href="./pages/home.html">Home</a>
    
    -->
   
    <!--! 3. Apni website ke page me ek section ko dosre section se link karna 
    
    1. ID       #
    2. Class    .

   <!--? Id  
   
    <h1 id="top">Heading 1</h1>
    <a href="#top">Go to Top</a>

   <!--? Class  
   
   <h1 class="top">Heading 1</h1>
   <a href=".top">Go to Top</a>
   
   -->

    <!--! Link Kese karain (Relation)
    
    1. Apne Sibling ko link karna (Yani Same Page)       →  Direct Name
    2. Apne Child ko link karna   (Yani Folder ke Andar) →  Name/
    3. Apne Parent ko link Karna  (Yani Folder se Bahir) →  ../Name
    
    -->
    



   

</body>

</html>
