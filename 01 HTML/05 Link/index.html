<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link</title>
</head>

<body>
    

    <!--! Information
    
    a       → anchor
    URL     → Address
    href    → Hyper Reference

    -->  
    
    <!--! Absolute URL   

    <a href="https://www.youtube.com">YouTube</a>

    -->
    
    <!--! Relative URl

    1. Apni website ke ek page ko dosre page se link karna  
    2. Apni website ke page me ek section ko dosre section se link karna

    -->
 
    <!--! 1. Apni website ke ek page ko dosre page se link karna
      
    1. Apne Sibling ko link karna (Yani Same Page)       →  Direct Name  → <a href="sibling.html">Sibling</a>
    2. Apne Child ko link karna   (Yani Folder ke Andar) →  Name/        → <a href="pages/child.html">Child</a>
    3. Apne Parent ko link Karna  (Yani Folder se Bahir) →  ../Name      → <a href="../index.html">Main Page</a>

    -->
   
    <!--! 2. Apni website ke page me ek section ko dosre section se link karna 

   <!--? Id     (#)
   
    <h1 id="top">Heading 1</h1>
    <a href="#top">Go to Top</a>   

   <!--? Class  (.)
   
   <h1 class="top">Heading 1</h1>
   <a href=".top">Go to Top</a>

   <!--! Attributes
   
   1. target="_blank"
   2. download="download"
   
   -->


</body>

</html>
